<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>티끌모아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Do+Hyeon&display=swap">
<style>
/* Layout: 한 장짜리 앱 — 위에 월 달력(날짜마다 완료/전체), 아래에 선택한 날의 체크리스트(반복 + 일회성) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --line:#dde3e8; --fg:#18232c; --muted:#66727d;
  --accent:#1f7a6d; --accent-soft:#d6ece8; --done:#2e9e5b; --warn:#c98a1b; --sun:#c4473a; --sat:#2f63b8;
  --rep:#6a55b5; --rep-soft:#ebe6f8; --stamp:#d43d3d; --imp:#e8473a; --imp-soft:#fdecea;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --surface:#1a232a; --line:#2b3740; --fg:#e6edf1; --muted:#93a1ab;
  --accent:#4fbfae; --accent-soft:#1d3a36; --done:#4cc27e; --warn:#e0a640; --sun:#ef7a6c; --sat:#7ea6ec;
  --rep:#b4a3f0; --rep-soft:#2c2745; --stamp:#ff7070; --imp:#ff6b5e; --imp-soft:#3a2522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --surface:#1a232a; --line:#2b3740; --fg:#e6edf1; --muted:#93a1ab;
  --accent:#4fbfae; --accent-soft:#1d3a36; --done:#4cc27e; --warn:#e0a640; --sun:#ef7a6c; --sat:#7ea6ec;
  --rep:#b4a3f0; --rep-soft:#2c2745; --stamp:#ff7070; --imp:#ff6b5e; --imp-soft:#3a2522; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.5px}
.navbtn{background:var(--surface);border:1px solid var(--line);color:var(--fg);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{display:flex;align-items:center;gap:8px}
.today-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 4px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 2px}
.dow div{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;letter-spacing:.05em}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.day{height:50px;max-width:100%;border:none;background:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding:2px 0;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.day:hover{background:var(--bg)}
.day .n{font-size:14px;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.sun .n{color:var(--sun)} .day.sat .n{color:var(--sat)} .day.hol .n{color:var(--sun)}
.hol-name{font-family:var(--body);font-size:13px;color:var(--sun);margin-left:6px}
.day.today .n{border:1.5px solid var(--accent)}
.day.sel{background:var(--accent-soft)}
.day.sel .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.day{position:relative}
.stamp{position:absolute;right:-1px;bottom:-1px;width:30px;height:30px;transform:rotate(-14deg);color:var(--stamp);opacity:.92;pointer-events:none}
.stamp svg{width:100%;height:100%;display:block}
.day.stamped .n{opacity:.85}
.big-stamp{position:absolute;right:-2px;top:-4px;width:56px;height:56px;color:var(--stamp);transform:rotate(-12deg);pointer-events:none}
.big-stamp svg{width:100%;height:100%;display:block}
.big-stamp.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:rotate(-30deg) scale(1.8);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.panel-head{position:relative}
.panel-left{display:flex;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:6px;min-width:0;padding-right:56px}
.day.empty{visibility:hidden}
.cnt{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1;padding:2px 4px;border-radius:6px}
.cnt.part{color:var(--warn)}
.cnt.full{color:#fff;background:var(--done)}
.cnt.future{opacity:.55}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;line-height:1.3}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
form{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
#newTask{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;line-height:1.6;box-sizing:border-box;height:40px}
.add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:14px;font:inherit;font-weight:600;cursor:pointer}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.wd button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--rep);border-color:var(--rep);color:#fff}
.seg button[data-r="once"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd button{width:34px;padding:3px 0;text-align:center}
.wd button[aria-pressed="true"]{background:var(--rep-soft);border-color:var(--rep);color:var(--rep);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;padding:6px 2px;min-height:40px;box-sizing:border-box;border-top:1px solid var(--line);flex-wrap:wrap}
li:first-child{border-top:none}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;overflow-wrap:anywhere}
li input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--done);flex:none}
li.done .t{color:var(--muted);text-decoration:line-through}
li.imp{background:var(--imp-soft);border-radius:8px;margin:1px 0}
li.imp .t{font-weight:600}
li.imp.done .t{font-weight:400}
.grip{flex:none;width:22px;height:28px;display:grid;place-items:center;color:var(--muted);opacity:.55;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;letter-spacing:-1px}
.star{background:none;border:none;color:var(--muted);opacity:.45;font-size:18px;line-height:1;cursor:pointer;width:28px;height:28px;border-radius:7px;flex:none;padding:0}
.star[aria-pressed="true"]{color:var(--imp);opacity:1}
li.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:8px;transition:none}
li.shift{transition:transform .15s}
.impdot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--imp)}
.tag{flex:none;font-size:11px;font-weight:500;color:var(--rep);background:var(--rep-soft);border-radius:6px;padding:0 6px;white-space:nowrap}
.del{background:none;border:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;width:28px;height:28px;border-radius:7px;flex:none}
.del:hover{background:var(--bg);color:var(--sun)}
.ask{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:30px;font-size:13px;color:var(--muted)}
.ask button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.ask button.danger{color:var(--sun);border-color:var(--sun)}
.empty-msg{color:var(--muted);font-size:14px;text-align:center;padding:12px 0;justify-content:center}
.note{font-size:12px;color:var(--muted);text-align:center}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.head-right{display:flex;gap:6px;align-items:center}
.install{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.install img{width:36px;height:36px;border-radius:8px;flex:none}
.install span{flex:1;min-width:0}
.install b{font-weight:600}
.install .ib{background:#fff;color:var(--accent);border:none;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.install .ix{background:none;border:none;color:#fff;opacity:.8;font-size:18px;line-height:1;cursor:pointer;width:28px;height:28px;flex:none}
.remind{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:8px 12px;font-size:13px}
.remind span{flex:1;min-width:0}
.remind button{border:none;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.remind .go{background:var(--accent);color:#fff;font-weight:600}
.remind .later{background:none;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center;z-index:20}
.tools button,.restore{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.big-stamp.pop{animation:none}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="month">
      <button class="navbtn" id="prev" aria-label="이전 달">‹</button>
      <h1 id="monthLabel">2026년 11월</h1>
      <button class="navbtn" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="head-right">
      <button class="today-btn" id="goToday">오늘</button>
      <button class="today-btn" id="more" aria-label="백업 메뉴" aria-expanded="false">⋯</button>
    </div>
  </header>

  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="">
    <span id="installText"></span>
    <button type="button" class="ib" id="installBtn" hidden></button>
    <button type="button" class="ix" id="installClose" aria-label="닫기">×</button>
  </div>
  <div class="remind" id="remind" hidden>
    <span id="remindText">백업한 지 2주가 지났어요.</span>
    <button type="button" class="go" id="remindGo">지금 백업</button>
    <button type="button" class="later" id="remindLater">나중에</button>
  </div>
  <section class="cal" aria-label="달력">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-left">
        <h2 id="dayLabel">11월 10일 화요일</h2>
        <span class="score" id="score">(0 / 0 완료)</span>
      </div>
      <div class="big-stamp" id="bigStamp" hidden></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <form id="addForm">
      <div class="row">
        <input id="newTask" type="text" placeholder="할 일을 적고 추가를 누르세요" autocomplete="off" maxlength="200">
        <button class="add" type="submit">추가</button>
      </div>
      <div class="seg" id="seg" role="group" aria-label="반복">
        <button type="button" data-r="once" aria-pressed="true">한번</button>
        <button type="button" data-r="daily" aria-pressed="false">매일</button>
        <button type="button" data-r="weekday" aria-pressed="false">평일</button>
        <button type="button" data-r="weekend" aria-pressed="false">주말</button>
        <button type="button" data-r="custom" aria-pressed="false">요일</button>
      </div>
      <div class="wd" id="wd" hidden></div>
      <div class="hint" id="hint" hidden></div>
    </form>
    <ul id="list"></ul>
  </section>
  <p class="note" id="status" hidden>불러오는 중…</p>
  <div class="toast" id="toast" hidden></div>
  <div class="tools" id="tools" hidden><button type="button" id="backup">백업 저장</button><label class="restore">백업 불러오기<input type="file" id="restoreFile" accept="application/json,.json" hidden></label></div>
</div>

<script>
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>new Date(k+'T00:00:00');
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d);};
const WD=['일','월','화','수','목','금','토'];
const HOL={
'2025-01-01':'신정','2025-01-27':'임시공휴일','2025-01-28':'설날 연휴','2025-01-29':'설날','2025-01-30':'설날 연휴','2025-03-01':'삼일절','2025-03-03':'대체공휴일','2025-05-05':'어린이날·부처님오신날','2025-05-06':'대체공휴일','2025-06-03':'대통령 선거','2025-06-06':'현충일','2025-08-15':'광복절','2025-10-03':'개천절','2025-10-05':'추석 연휴','2025-10-06':'추석','2025-10-07':'추석 연휴','2025-10-08':'대체공휴일','2025-10-09':'한글날','2025-12-25':'크리스마스',
'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-01':'근로자의 날','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'크리스마스',
'2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'근로자의 날','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'크리스마스','2027-12-27':'대체공휴일'};

const uid6=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=new Date(), TODAY=key(now);
let view=new Date(now.getFullYear(),now.getMonth(),1);
let sel=TODAY;
let days={};      // { "2026-11-10": {items:[{id,text,done}], rdone:{rid:true}, skip:[rid]} }
let routines=[];  // [{id,text,wd:[0..6],start,end}]
let col=null;
let mode='once', pickWd=[];
let asking=null;  // 삭제 확인 중인 반복 id
const $=id=>document.getElementById(id);

const dayRec=k=>{const d=days[k]||(days[k]={items:[],rdone:{},skip:[]});d.rimp=d.rimp||{};d.order=d.order||[];return d;};
function routinesFor(k){
  const w=parse(k).getDay(), skip=(days[k]&&days[k].skip)||[];
  return routines.filter(r=>r.wd.includes(w)&&k>=r.start&&(!r.end||k<=r.end)&&!skip.includes(r.id));
}
function tally(k){
  const d=days[k]||{items:[],rdone:{}}, rs=routinesFor(k);
  const total=rs.length+d.items.length;
  const done=rs.filter(r=>d.rdone&&d.rdone[r.id]).length+d.items.filter(x=>x.done).length;
  const impLeft=rs.some(r=>d.rimp&&d.rimp[r.id]&&!(d.rdone&&d.rdone[r.id]))||d.items.some(x=>x.imp&&!x.done);
  return {total,done,rs,d,impLeft};
}
function label(wd){
  const s=[...wd].sort().join('');
  if(s==='0123456')return'매일'; if(s==='12345')return'평일'; if(s==='06')return'주말';
  return wd.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>WD[i]).join('·');
}

/* '참 잘했어요' 도장 */
function stampSVG(){
  let d='';const N=16,R=46,r=41;
  for(let i=0;i<=N*2;i++){const a=Math.PI*i/N, rr=i%2?r:R;d+=(i?'L':'M')+(50+rr*Math.cos(a)).toFixed(1)+' '+(50+rr*Math.sin(a)).toFixed(1);}
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="'+d+'Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>'+
    '<circle cx="50" cy="50" r="33" fill="none" stroke="currentColor" stroke-width="2.5"/>'+
    '<text x="50" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor" font-family="Do Hyeon,sans-serif">참 잘</text>'+
    '<text x="50" y="66" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor" font-family="Do Hyeon,sans-serif">했어요</text></svg>';
}
const STAMP=stampSVG();
let lastSelDone=null;
function render(){
  $('monthLabel').textContent=view.getFullYear()+'년 '+(view.getMonth()+1)+'월';
  const g=$('grid'); g.innerHTML='';
  const first=view.getDay(), last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e);}
  for(let d=1;d<=last;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d), k=key(dt), t=tally(k);
    const b=document.createElement('button');
    b.className='day'+(dt.getDay()===0?' sun':'')+(dt.getDay()===6?' sat':'')+(HOL[k]?' hol':'')+(k===TODAY?' today':'')+(k===sel?' sel':'');
    b.setAttribute('aria-label',(dt.getMonth()+1)+'월 '+d+'일');
    const n=document.createElement('span');n.className='n';n.textContent=d;b.appendChild(n);
    if(t.total&&t.done===t.total&&k<=TODAY){
      b.classList.add('stamped');
      const s=document.createElement('span');s.className='stamp';s.innerHTML=STAMP;b.appendChild(s);
    } else if(t.total){
      if(t.impLeft){const dot=document.createElement('span');dot.className='impdot';dot.title='꼭 할 일 남음';b.appendChild(dot);}
      const c=document.createElement('span');
      c.className='cnt '+(t.done===t.total?'full':t.done>0?'part':'')+(k>TODAY?' future':'');
      c.textContent=t.done+'/'+t.total;b.appendChild(c);
    }
    b.onclick=()=>{sel=k;asking=null;lastSelDone=null;syncWd();render();};
    g.appendChild(b);
  }
  const sd=parse(sel);
  $('dayLabel').textContent=(sd.getMonth()+1)+'월 '+sd.getDate()+'일 '+WD[sd.getDay()]+'요일';
  if(HOL[sel]){const h=document.createElement('span');h.className='hol-name';h.textContent=HOL[sel];$('dayLabel').appendChild(h);}
  const t=tally(sel);
  $('score').textContent='('+t.done+' / '+t.total+' 완료)';
  const allDone=t.total>0&&t.done===t.total&&sel<=TODAY, bs=$('bigStamp');
  if(!bs.innerHTML) bs.innerHTML=STAMP;
  bs.hidden=!allDone;
  if(allDone&&lastSelDone===false){bs.classList.remove('pop');void bs.offsetWidth;bs.classList.add('pop');}
  lastSelDone=allDone;
  $('barFill').style.width=t.total?(t.done/t.total*100)+'%':'0';
  const ul=$('list'); ul.innerHTML='';
  if(!t.total){const p=document.createElement('li');p.className='empty-msg';p.textContent='이 날은 할 일이 없어요. 위 칸에 적어서 추가해 보세요.';ul.appendChild(p);}
  const rows=[];
  t.rs.forEach(r=>{
    const done=!!(t.d.rdone&&t.d.rdone[r.id]);
    const imp=!!(t.d.rimp&&t.d.rimp[r.id]);
    rows.push({key:'r:'+r.id,el:item('r-'+r.id,r.text,done,label(r.wd),
      v=>{const d=dayRec(sel);if(v)d.rdone[r.id]=true;else delete d.rdone[r.id];saveDay(sel);},
      ()=>{asking=asking===r.id?null:r.id;render();},
      asking===r.id?r:null,imp,
      ()=>{const d=dayRec(sel);if(d.rimp[r.id])delete d.rimp[r.id];else d.rimp[r.id]=true;saveDay(sel);})});
  });
  t.d.items.forEach(it=>{
    rows.push({key:'i:'+it.id,el:item('i-'+it.id,it.text,!!it.done,null,
      v=>{it.done=v;saveDay(sel);},
      ()=>{dayRec(sel).items=t.d.items.filter(x=>x!==it);saveDay(sel);},null,!!it.imp,
      ()=>{it.imp=!it.imp;saveDay(sel);})});
  });
  const ord=(t.d.order)||[];
  rows.forEach((r,i)=>{const p=ord.indexOf(r.key);r.pos=p<0?1e6+i:p;});
  rows.sort((a,b)=>a.pos-b.pos);
  rows.forEach(r=>{r.el.dataset.key=r.key;ul.appendChild(r.el);});
  enableDrag(ul);
}

/* 끌어서 순서 바꾸기 (≡ 손잡이) */
function enableDrag(ul){
  ul.querySelectorAll('.grip').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      const li=g.closest('li'); if(!li) return;
      e.preventDefault();
      try{g.setPointerCapture(e.pointerId);}catch(err){}
      const rows=[...ul.querySelectorAll('li[data-key]')];
      const from=rows.indexOf(li); let to=from;
      const mids=rows.map(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2;});
      const h=li.getBoundingClientRect().height, startY=e.clientY;
      li.classList.add('dragging');
      rows.forEach(r=>{if(r!==li)r.classList.add('shift');});
      const move=ev=>{
        const dy=ev.clientY-startY, y=mids[from]+dy;
        li.style.transform='translateY('+dy+'px)';
        to=rows.filter((r,i)=>i!==from&&mids[i]<y).length;
        rows.forEach((r,i)=>{
          if(i===from) return;
          let s=0;
          if(from<to&&i>from&&i<=to) s=-h;
          if(to<from&&i>=to&&i<from) s=h;
          r.style.transform=s?'translateY('+s+'px)':'';
        });
      };
      const up=()=>{
        g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
        rows.forEach(r=>{r.style.transform='';r.classList.remove('shift','dragging');});
        if(to!==from){
          const keys=rows.map(r=>r.dataset.key);
          const [k]=keys.splice(from,1); keys.splice(to,0,k);
          dayRec(sel).order=keys; saveDay(sel);
        }
      };
      g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
    });
  });
}

function item(id,text,done,tag,onCheck,onDel,ask,imp,onStar){
  const li=document.createElement('li'); li.className=(done?'done ':'')+(imp?'imp':'');
  const gr=document.createElement('span');gr.className='grip';gr.textContent='≡';gr.setAttribute('aria-label','끌어서 순서 바꾸기');gr.title='끌어서 순서 바꾸기';
  li.appendChild(gr);
  const lb=document.createElement('label');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=done;cb.id='cb-'+id;
  cb.onchange=()=>onCheck(cb.checked);
  const s=document.createElement('span');s.className='t';s.textContent=text;
  lb.append(cb,s); li.appendChild(lb);
  if(tag){const g=document.createElement('span');g.className='tag';g.textContent=tag;li.appendChild(g);}
  const st=document.createElement('button');st.type='button';st.className='star';st.textContent=imp?'★':'☆';
  st.setAttribute('aria-pressed',!!imp);st.setAttribute('aria-label','꼭 할 일 표시');st.title='꼭 할 일';
  st.onclick=onStar; li.appendChild(st);
  const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','삭제');
  del.onclick=onDel; li.appendChild(del);
  if(ask){
    const a=document.createElement('div');a.className='ask';
    a.append('반복 할 일이에요.');
    const b1=document.createElement('button');b1.type='button';b1.textContent='이 날만 빼기';
    b1.onclick=()=>{const d=dayRec(sel);d.skip=[...(d.skip||[]),ask.id];asking=null;saveDay(sel);};
    const b2=document.createElement('button');b2.type='button';b2.className='danger';b2.textContent='이 날부터 반복 끝내기';
    b2.onclick=()=>{
      asking=null;
      if(sel<=ask.start) routines=routines.filter(x=>x!==ask); else ask.end=addDays(sel,-1);
      saveRoutines();
    };
    const b3=document.createElement('button');b3.type='button';b3.textContent='취소';
    b3.onclick=()=>{asking=null;render();};
    a.append(b1,b2,b3); li.appendChild(a);
  }
  return li;
}

/* 반복 선택 UI */
const PRESET={daily:[0,1,2,3,4,5,6],weekday:[1,2,3,4,5],weekend:[0,6]};
const HINT={once:'',daily:'선택한 날부터 매일 자동으로 표시돼요.',weekday:'선택한 날부터 월~금에 자동으로 표시돼요.',weekend:'선택한 날부터 토·일에 자동으로 표시돼요.'};
function syncWd(){ if(mode==='custom'&&!pickWd.length) pickWd=[parse(sel).getDay()]; drawWd(); }
function drawWd(){
  const box=$('wd'); box.hidden=mode!=='custom'; box.innerHTML='';
  [1,2,3,4,5,6,0].forEach(i=>{
    const b=document.createElement('button');b.type='button';b.textContent=WD[i];
    b.setAttribute('aria-pressed',pickWd.includes(i));
    b.onclick=()=>{pickWd=pickWd.includes(i)?pickWd.filter(x=>x!==i):[...pickWd,i];drawWd();};
    box.appendChild(b);
  });
  $('hint').textContent=mode==='custom'
    ?(pickWd.length?'선택한 날부터 매주 '+label(pickWd)+'에 자동으로 표시돼요.':'요일을 하나 이상 골라 주세요.')
    :HINT[mode];
  $('hint').hidden=!$('hint').textContent;
}
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.r;
  $('seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(mode==='custom'&&!pickWd.length) pickWd=[parse(sel).getDay()];
  drawWd();
});

$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('newTask').value.trim(); if(!v) return;
  if(mode==='once'){
    dayRec(sel).items.push({id:uid6(),text:v,done:false});
    $('newTask').value=''; saveDay(sel);
  } else {
    const wd=mode==='custom'?[...pickWd]:PRESET[mode];
    if(!wd.length){$('hint').textContent='요일을 하나 이상 골라 주세요.';$('hint').hidden=false;return;}
    routines.push({id:uid6(),text:v,wd,start:sel,end:null});
    $('newTask').value=''; saveRoutines();
  }
});
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
$('goToday').onclick=()=>{view=new Date(now.getFullYear(),now.getMonth(),1);sel=TODAY;asking=null;render();};

/* 저장 */
let writing=Promise.resolve();
const fail=e=>{$('status').textContent=e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 지난 날짜의 할 일을 지워 주세요.':'저장하지 못했어요. 인터넷 연결을 확인해 주세요.';};
function saveLocal(){try{localStorage.setItem('todo-days',JSON.stringify(days));localStorage.setItem('todo-routines',JSON.stringify(routines));}catch(e){}}
function saveDay(k){
  render();
  const d=days[k]||{items:[],rdone:{},skip:[]};
  const body={date:k,items:d.items.map(x=>({id:x.id,text:x.text,done:!!x.done,imp:!!x.imp})),rdone:{...(d.rdone||{})},skip:[...(d.skip||[])],rimp:{...(d.rimp||{})},order:[...(d.order||[])]};
  const emptyDay=!body.items.length&&!Object.keys(body.rdone).length&&!body.skip.length&&!Object.keys(body.rimp).length;
  if(!col){saveLocal();return;}
  writing=writing.then(()=>emptyDay?col.doc('d'+k).delete():col.doc('d'+k).set(body)).catch(fail);
}
function saveRoutines(){
  render();
  if(!col){saveLocal();return;}
  const list=routines.map(r=>({id:r.id,text:r.text,wd:[...r.wd],start:r.start,end:r.end||null}));
  writing=writing.then(()=>col.doc('routines').set({list})).catch(fail);
}

function useLocal(msg){
  try{days=JSON.parse(localStorage.getItem('todo-days')||'{}')||{};}catch(e){days={};}
  try{routines=JSON.parse(localStorage.getItem('todo-routines')||'[]')||[];}catch(e){routines=[];}
  Object.values(days).forEach(d=>{d.items=d.items||[];d.rdone=d.rdone||{};d.skip=d.skip||[];});
  $('status').textContent=msg; render();
}

drawWd(); render();
useLocal('이 핸드폰에만 저장돼요. 가끔 백업해 두세요.');
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});
}

/* 백업 / 복원 */
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3000);}

/* 브라우저에 영구 저장 요청 (저장공간 부족 시 자동 삭제 방지) */
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}

/* 백업 알림: 마지막 백업(또는 처음 사용) 후 14일이 지나면 표시 */
const DAY=86400000;
if(!ls.get('todo-firstUse')) ls.set('todo-firstUse',String(Date.now()));
function hasData(){return routines.length>0||Object.values(days).some(d=>d.items&&d.items.length);}
function checkRemind(){
  const last=Number(ls.get('todo-lastBackup')||ls.get('todo-firstUse')||Date.now());
  const snooze=Number(ls.get('todo-snooze')||0);
  const t=Date.now(), passed=Math.floor((t-last)/DAY);
  const show=hasData()&&passed>=14&&t>snooze;
  $('remind').hidden=!show;
  if(show) $('remindText').textContent=ls.get('todo-lastBackup')?'마지막 백업 후 '+passed+'일이 지났어요.':'아직 백업한 적이 없어요. 한 번 저장해 두세요.';
}
function doBackup(){
  const blob=new Blob([JSON.stringify({v:1,days,routines})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='티끌모아-백업-'+TODAY+'.json';
  document.body.appendChild(a);a.click();a.remove();
  ls.set('todo-lastBackup',String(Date.now()));
  checkRemind();

  toast('백업 파일을 다운로드 폴더에 저장했어요.');
}
$('backup').onclick=doBackup;
$('remindGo').onclick=doBackup;
$('remindLater').onclick=()=>{ls.set('todo-snooze',String(Date.now()+3*DAY));checkRemind();};
$('more').onclick=()=>{const open=$('tools').hidden;$('tools').hidden=!open;$('more').setAttribute('aria-expanded',open);if(open)$('tools').scrollIntoView({behavior:'smooth',block:'nearest'});};
checkRemind();
/* 설치 도우미: 브라우저로 열었을 때 앱 설치를 안내 */
(function(){
  const ua=navigator.userAgent;
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone) return;
  const until=Number(ls.get('todo-installSnooze')||0);
  const box=$('install'),txt=$('installText'),btn=$('installBtn');
  const show=(html,label,fn)=>{
    if(Date.now()<until&&!/KAKAOTALK/i.test(ua)) return;
    txt.innerHTML=html+' <a href="guide.html" style="color:#fff;text-decoration:underline;white-space:nowrap">그림으로 보기</a>'; btn.hidden=!label; if(label){btn.textContent=label;btn.onclick=fn;} box.hidden=false;
  };
  const hide=()=>{box.hidden=true;};
  $('installClose').onclick=()=>{ls.set('todo-installSnooze',String(Date.now()+7*DAY));hide();};
  window.addEventListener('appinstalled',()=>{hide();toast('설치됐어요! 이제 홈 화면 아이콘으로 여세요.');});
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  const external='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);

  if(/KAKAOTALK/i.test(ua)){
    // 카카오톡 안 브라우저는 설치가 안 되므로 기본 브라우저로 바로 넘김
    show('<b>카카오톡 안에서는 설치가 안 돼요.</b><br>'+(isIOS?'Safari':'Chrome')+'로 열어서 설치해 주세요.','브라우저로 열기',()=>{location.href=external;});
    setTimeout(()=>{location.href=external;},400);
    return;
  }
  if(/NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua)){
    show('<b>이 앱 안에서는 설치가 안 돼요.</b><br>오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러 주세요.');
    return;
  }
  if(isIOS){
    show('<b>앱으로 설치하기</b><br>아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요.');
    return;
  }
  let prompted=false;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); prompted=true;
    show('<b>티끌모아를 앱으로 설치할 수 있어요.</b><br>홈 화면에서 바로 열려요.','설치',async()=>{
      e.prompt();
      try{const r=await e.userChoice; if(r.outcome==='accepted') hide();}catch(err){}
    });
  });
  setTimeout(()=>{
    if(prompted) return;
    show('<b>앱으로 설치하기</b><br>오른쪽 위 <b>⋮</b> 메뉴 → <b>홈 화면에 추가</b>를 누르세요. 이미 설치했다면 홈 화면 아이콘으로 여세요.');
  },2500);
})();
$('restoreFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const x=JSON.parse(await f.text());
    if(!x||typeof x.days!=='object'||!Array.isArray(x.routines)) throw 0;
    days=x.days; routines=x.routines; saveLocal();
    Object.values(days).forEach(d=>{d.items=d.items||[];d.rdone=d.rdone||{};d.skip=d.skip||[];});
    toast('백업을 불러왔어요.'); render(); checkRemind();
  }catch(err){toast('백업 파일을 읽지 못했어요. 티끌모아에서 저장한 .json 파일인지 확인해 주세요.');}
  e.target.value='';
};
